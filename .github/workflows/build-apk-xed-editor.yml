name: build-apk-xed-editor

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Xed-Editor 源仓库的分支名/Tag/commit SHA（默认: main）'
        required: false
        default: 'main'
        type: string
      abi_filter:
        description: 'ABI（留空构建全部 ABI）'
        required: false
        default: 'arm64-v8a'
        type: string

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: 'temurin'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: Xed-Editor/Xed-Editor
          ref: ${{ inputs.source_ref || 'main' }}
          path: xed_editor_source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate build metadata
        env:
          INPUT_REF: ${{ inputs.source_ref || 'main' }}
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          SAFE_REF="${INPUT_REF//\//-}"
          echo "SAFE_REF=${SAFE_REF}" >> $GITHUB_ENV
          echo "SOURCE_SHA=$(git -C xed_editor_source rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Detect flavor and build task
        working-directory: ./xed_editor_source
        run: |
          if grep -q "productFlavors" app/build.gradle.kts; then
            echo "GRADLE_TASK=assembleCommunityRelease" >> $GITHUB_ENV
            echo "APK_OUTPUT_DIR=app/build/outputs/apk/community/release" >> $GITHUB_ENV
          else
            echo "GRADLE_TASK=assembleRelease" >> $GITHUB_ENV
            echo "APK_OUTPUT_DIR=app/build/outputs/apk/release" >> $GITHUB_ENV
          fi

      - name: Setup java
        uses: actions/setup-java@main
        with:
          distribution: '${{ env.JDK_DISTRIBUTION }}'
          java-version: '${{ env.JDK_VERSION }}'
          cache: gradle

      - name: Accept android sdk licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses

      # app/build.gradle.kts中，硬编码了xed.keystore和signing.properties的路径
      - name: Decode and create secrets
        run: |
          mkdir -p /tmp
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/xed.keystore
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" > /tmp/signing.properties
          echo "keyPassword=${{ secrets.KEY_ALIAS_PASSWORD }}" >> /tmp/signing.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> /tmp/signing.properties

      # 修复：弃用 -Pandroid.injected.build.abi（AGP 9 下进入 IDE 注入分支，
      # APK 不再落到标准 outputs 路径），改为向 defaultConfig 注入 ndk.abiFilters
      - name: Build release apk files
        working-directory: ./xed_editor_source
        env:
          ABI_FILTER: ${{ inputs.abi_filter }}
        run: |
          chmod +x ./gradlew
          if [ -n "$ABI_FILTER" ]; then
            python3 - <<'PYEOF'
          import os, pathlib
          p = pathlib.Path("app/build.gradle.kts")
          s = p.read_text()
          abis = [a.strip() for a in os.environ["ABI_FILTER"].split(",") if a.strip()]
          inject = 'ndk { abiFilters.addAll(listOf(' + ', '.join(f'"{a}"' for a in abis) + ')) }'
          if inject not in s:
              assert "defaultConfig {" in s, "defaultConfig block not found in app/build.gradle.kts"
              s = s.replace("defaultConfig {", "defaultConfig {\n        " + inject, 1)
              p.write_text(s)
          print("Injected into defaultConfig:", inject)
          PYEOF
          fi
          ./gradlew ${{ env.GRADLE_TASK }} --no-daemon

      - name: List generated apk files
        working-directory: ./xed_editor_source
        run: |
          echo "Listing all apk files generated:"
          find app/build/outputs -type f -name "*.apk" | sort
          APK_COUNT=$(find app/build/outputs -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK found under app/build/outputs"
            echo "=== diagnostic: any .apk anywhere under app/build ==="
            find app/build -type f -name "*.apk" | head -n 20 || true
            exit 1
          fi
          for apk in $(find app/build/outputs -type f -name "*.apk"); do
            echo "== $apk =="
            unzip -l "$apk" | grep -E 'lib/' || echo "(no native libs)"
          done

      - name: Rename and move
        working-directory: ./xed_editor_source
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          mv ${{ env.APK_OUTPUT_DIR }}/*.apk "${{ github.workspace }}/dist/xed-editor-${{env.BUILD_DATE}}-${{env.SOURCE_SHA}}.apk"

      - name: Erase keystore, encrypt package and create release
        uses: ./ci_source/.github/actions/erase_aes256pac_release/
        with:
          P12_KEYSTORE_PATH: "/tmp/xed.keystore"
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          BUILD_ARTIFACT_PATH: "./dist/xed-editor-${{env.BUILD_DATE}}-${{env.SOURCE_SHA}}.apk"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-xed-editor-${{ env.SOURCE_SHA }}"

      - name: Cleanup signing files
        if: always()
        run: rm -f /tmp/xed.keystore /tmp/signing.properties
