name: download-apks-from-apkmirror

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "应用列表，格式：org/repo，分号分隔"
        required: true
        default: "mx-tech/mx-player"
        type: string
      architecture:
        description: "架构"
        required: false
        default: "arm64-v8a"
        type: string
      architecture_fallback:
        description: "回退架构（v2.0.9+ 支持，留空禁用）"
        required: false
        default: "universal"
        type: string
      app_type:
        description: "下载类型（apk 或 bundle）"
        required: false
        default: "apk"
        type: string
      max_retries:
        description: "整批最大尝试次数"
        required: false
        default: "5"
        type: string
      retry_base_delay:
        description: "重试基础间隔（秒）"
        required: false
        default: "30"
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  download:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Install apkmd
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE/.apkmd-tool"
          mkdir -p "$WORK"
          curl -fsSL "https://github.com/tanishqmanuja/apkmirror-downloader/releases/latest/download/apkmd" -o "$WORK/apkmd"
          FT=$(file -b "$WORK/apkmd")
          echo "file type: $FT"
          if ! echo "$FT" | grep -q 'ELF'; then
            echo "::error::downloaded file is not an ELF binary"
            head -c 200 "$WORK/apkmd" || true
            exit 1
          fi
          sudo install -m 0755 "$WORK/apkmd" /usr/local/bin/apkmd
          apkmd --help

      - name: Create apps.json
        env:
          APPS_INPUT: ${{ inputs.apps }}
          ARCH: ${{ inputs.architecture }}
          ARCH_FALLBACK: ${{ inputs.architecture_fallback }}
          APP_TYPE: ${{ inputs.app_type }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/apks-apkmirror-${BUILD_DATE}"
          WORK="${GITHUB_WORKSPACE}/.apkmd-tool"
          mkdir -p "$OUT_DIR" "$WORK"
          apps_json=""
          count=0
          IFS=';' read -ra app_list <<< "$APPS_INPUT"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | xargs)
            if [ -z "$app" ]; then continue; fi
            org="${app%%/*}"
            repo="${app##*/}"
            if [ "$app" = "$org" ] || [ -z "$repo" ]; then
              echo "::error::invalid format, expected org/repo, got: $app"
              exit 1
            fi
            if [ -n "$apps_json" ]; then apps_json="${apps_json},"; fi
            apps_json="${apps_json}    {\"org\": \"$org\", \"repo\": \"$repo\"}"
            count=$((count + 1))
            echo "added: org=$org, repo=$repo"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::app list is empty"
            exit 1
          fi
          {
            echo '{'
            echo '  "options": {'
            echo "    \"arch\": \"$ARCH\","
            if [ -n "$ARCH_FALLBACK" ]; then
              echo "    \"fallbackArch\": \"$ARCH_FALLBACK\","
            fi
            echo "    \"type\": \"$APP_TYPE\","
            echo "    \"outDir\": \"$OUT_DIR\""
            echo '  },'
            echo '  "apps": ['
            echo "$apps_json"
            echo '  ]'
            echo '}'
          } > "$WORK/apps.json"
          echo "APP_COUNT=$count" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          cat "$WORK/apps.json"

      - name: Preflight - verify app slugs
        env:
          APPS_INPUT: ${{ inputs.apps }}
          # 走与下载相同的出口，预检才有参考意义
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:132.0) Gecko/20100101 Firefox/132.0"
          bad=""
          blocked=0
          ok=0
          IFS=';' read -ra app_list <<< "$APPS_INPUT"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | xargs)
            if [ -z "$app" ]; then continue; fi
            url="https://www.apkmirror.com/apk/${app}/"
            http_code=$(curl -sS -L -A "$UA" --max-time 30 -o /tmp/preflight.html -w '%{http_code}' "$url" || echo "000")
            case "$http_code" in
              200)
                if grep -qi "cannot be loaded without JavaScript" /tmp/preflight.html; then
                  echo "WARN: $app -> JS challenge page (CF blocked)"
                  blocked=$((blocked + 1))
                else
                  echo "OK: $app -> page fine"
                  ok=$((ok + 1))
                fi
                ;;
              404)
                echo "FAIL: $app -> 404, slug not found: $url"
                bad="$bad $app"
                ;;
              *)
                echo "WARN: $app -> HTTP $http_code"
                blocked=$((blocked + 1))
                ;;
            esac
          done
          bad_count=$(echo $bad | wc -w | tr -d ' ')
          echo "--- summary: ok=$ok / 404=$bad_count / blocked=$blocked ---"
          if [ -n "$bad" ]; then
            echo "::error::invalid slug(s):$bad -- verify at https://www.apkmirror.com/?s=APPNAME"
            exit 1
          fi

      # [关键改动] 挂代理换出口 IP。
      # Bun 的 fetch 遵循 HTTP(S)_PROXY 环境变量，apkmd 二进制继承此行为。
      # 未配置 PROXY_URL secret 时变量为空 = 直连（回到现状）。
      - name: Download APKs (proxy-aware, file-verified retry)
        env:
          MAX_RETRIES: ${{ inputs.max_retries }}
          BASE_DELAY: ${{ inputs.retry_base_delay }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
        run: |
          set -euo pipefail
          WORK="${GITHUB_WORKSPACE}/.apkmd-tool"
          cd "$WORK"
          EXPECTED="${APP_COUNT}"
          if [ -n "${HTTPS_PROXY:-}" ]; then
            echo "proxy: enabled (via PROXY_URL secret)"
          else
            echo "::notice::proxy: disabled -- set PROXY_URL secret to route via proxy"
          fi
          count_files() {
            find "$OUT_DIR" -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.apks' -o -iname '*.xapk' \) | wc -l | tr -d ' '
          }
          attempt=1
          while true; do
            echo "=== attempt $attempt/$MAX_RETRIES ==="
            apkmd apps.json || echo "::warning::apkmd exited non-zero (attempt $attempt)"
            n=$(count_files)
            echo "files: $n / expected: $EXPECTED"
            if [ "$n" -ge "$EXPECTED" ]; then
              echo "all apps downloaded"
              break
            fi
            if [ "$attempt" -ge "$MAX_RETRIES" ]; then
              if [ "$n" -gt 0 ]; then
                echo "::warning::retries exhausted, got $n/$EXPECTED, continue with partial"
                break
              fi
              echo "::error::no files downloaded after $MAX_RETRIES attempts"
              exit 1
            fi
            delay=$((BASE_DELAY * (2 ** (attempt - 1))))
            echo "incomplete, retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Final check
        run: |
          set -euo pipefail
          n=$(find "$OUT_DIR" -type f | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::error::output directory is empty, aborting"
            exit 1
          fi
          echo "total $n file(s):"
          ls -lh "$OUT_DIR/"

      - name: Encrypt apks and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ARTIFACT_DIRECTORY_PATH: "./apks-apkmirror-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-from-apkmirror"
