name: download-apks-from-apkmirror

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "应用列表，格式：org/repo，分号分隔"
        required: true
        default: "mx-tech/mx-player"
        type: string
      architecture:
        description: "架构（universal、arm64-v8a、armeabi-v7a 等）"
        required: false
        default: "arm64-v8a"
        type: string
      app_type:
        description: "下载类型（apk 或 bundle）"
        required: false
        default: "apk"
        type: string
      max_retries:
        description: "整批最大尝试次数"
        required: false
        default: "5"
        type: string
      retry_base_delay:
        description: "重试基础间隔（秒，指数退避）"
        required: false
        default: "30"
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  download:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # 官方二进制（Bun 运行时，不会被 CF 按 Node 指纹拦截）。
      # 注意：release 资产名为裸 "apkmd"（Linux）和 "apkmd.exe"（Windows），
      # 直接用 latest/download 固定 URL，无需 API 匹配。
      - name: Install apkmd (official prebuilt binary)
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/tanishqmanuja/apkmirror-downloader/releases/latest/download/apkmd" -o /tmp/apkmd
          FT=$(file -b /tmp/apkmd)
          echo "文件类型：$FT"
          # 必须是 ELF 可执行文件；若返回 JSON/HTML 说明 URL 或 release 出了问题
          echo "$FT" | grep -q 'ELF' || {
            echo "::error::下载到的不是 ELF 可执行文件，latest release 的资产结构可能已变化"
            echo "--- 前 200 字节 ---"
            head -c 200 /tmp/apkmd; echo
            exit 1
          }
          sudo install -m 0755 /tmp/apkmd /usr/local/bin/apkmd
          apkmd --help

      - name: Create apps.json
        env:
          APPS_INPUT: ${{ inputs.apps }}
          ARCH: ${{ inputs.architecture }}
          APP_TYPE: ${{ inputs.app_type }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/apks-apkmirror-${BUILD_DATE}"
          mkdir -p "$OUT_DIR" /tmp/apkmd
          apps_json=""
          count=0
          IFS=';' read -ra app_list <<< "$APPS_INPUT"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | xargs)
            [ -z "$app" ] && continue
            org="${app%%/*}"
            repo="${app##*/}"
            if [ "$app" = "$org" ] || [ -z "$repo" ]; then
              echo "::error::输入格式应为 org/repo，收到: $app"
              exit 1
            fi
            [ -n "$apps_json" ] && apps_json+=","
            apps_json+="    {\"org\": \"$org\", \"repo\": \"$repo\"}"
            count=$((count + 1))
            echo "已添加：org=$org, repo=$repo" >&2
          done
          [ "$count" -eq 0 ] && { echo "::error::应用列表为空"; exit 1; }
          {
            echo '{'
            echo '  "options": {'
            echo '    "arch": "'"$ARCH"'",'
            echo '    "type": "'"$APP_TYPE"'",'
            echo '    "outDir": "'"$OUT_DIR"'"'
            echo '  },'
            echo '  "apps": ['
            echo "$apps_json"
            echo '  ]'
            echo '}'
          } > /tmp/apkmd/apps.json
          echo "APP_COUNT=$count" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          cat /tmp/apkmd/apps.json

      # 上次承诺的预检：slug 是否存在 + 是否被 CF 拦截，先看清楚再下载
      - name: Preflight - verify app slugs on APKMirror
        env:
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:132.0) Gecko/20100101 Firefox/132.0"
          bad=""; blocked=0; ok=0
          IFS=';' read -ra app_list <<< "$APPS_INPUT"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | xargs)
            [ -z "$app" ] && continue
            url="https://www.apkmirror.com/apk/${app}/"
            http_code=$(curl -sS -L -A "$UA" --max-time 30 -o /tmp/preflight.html -w '%{http_code}' "$url" || echo "000")
            case "$http_code" in
              200)
                if grep -qi "cannot be loaded without JavaScript" /tmp/preflight.html; then
                  echo "⚠️  $app -> JS 质询页（CF 拦截）"
                  blocked=$((blocked + 1))
                else
                  echo "✅ $app -> 页面正常"
                  ok=$((ok + 1))
                fi ;;
              404) echo "❌ $app -> 404，slug 不存在：$url"; bad="$bad $app" ;;
              *)   echo "⚠️  $app -> HTTP $http_code"; blocked=$((blocked + 1)) ;;
            esac
          done
          echo "--- 汇总：正常 $ok / 404 $(echo $bad | wc -w | tr -d ' ') / 拦截 $blocked ---"
          if [ -n "$bad" ]; then
            echo "::error::slug 无效：$bad —— 请到 https://www.apkmirror.com/?s=应用名 核对地址栏路径"
            exit 1
          fi

      - name: Download APKs from APKMirror (file-verified retry)
        env:
          MAX_RETRIES: ${{ inputs.max_retries }}
          BASE_DELAY: ${{ inputs.retry_base_delay }}
        run: |
          set -euo pipefail
          cd /tmp/apkmd
          EXPECTED="${APP_COUNT}"

          count_files() {
            find "$OUT_DIR" -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.apks' -o -iname '*.xapk' \) | wc -l | tr -d ' '
          }

          attempt=1
          while true; do
            echo "=== 尝试第 $attempt/$MAX_RETRIES 次 ==="
            apkmd apps.json || echo "::warning::apkmd 返回非零退出码（第 $attempt 次）"
            n=$(count_files)
            echo "当前已下载文件数：$n / 期望（应用数）：$EXPECTED"
            if [ "$n" -ge "$EXPECTED" ]; then
              echo "✅ 已下载全部应用"
              break
            fi
            if [ "$attempt" -ge "$MAX_RETRIES" ]; then
              if [ "$n" -gt 0 ]; then
                echo "::warning::重试耗尽，仅下载到 $n/$EXPECTED 个，继续处理已下载内容"
                break
              fi
              echo "::error::重试 $MAX_RETRIES 次后一个文件都没下载到，终止"
              exit 1
            fi
            delay=$((BASE_DELAY * (2 ** (attempt - 1))))
            echo "未下载完整，${delay}s 后重试..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: List downloaded files (final check)
        run: |
          set -euo pipefail
          n=$(find "$OUT_DIR" -type f | wc -l | tr -d ' ')
          [ "$n" -eq 0 ] && { echo "::error::目录为空，中止发布"; exit 1; }
          echo "共 $n 个文件："
          ls -lh "$OUT_DIR/"

      - name: Encrypt apks and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ARTIFACT_DIRECTORY_PATH: "./apks-apkmirror-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-from-apkmirror"
