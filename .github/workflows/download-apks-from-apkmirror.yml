name: download-apks-from-apkmirror

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "应用列表，格式：org/repo，分号分隔"
        required: true
        default: "mx-tech/mx-player"
        type: string
      architecture:
        description: "架构（universal、arm64-v8a、armeabi-v7a 等）"
        required: false
        default: "arm64-v8a"
        type: string
      app_type:
        description: "下载类型（apk 或 bundle）"
        required: false
        default: "apk"
        type: string
      max_retries:
        description: "整批最大尝试次数"
        required: false
        default: "5"
        type: string
      retry_base_delay:
        description: "重试基础间隔（秒，指数退避）"
        required: false
        default: "30"
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  download:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # [关键修改] 不再用 npm 包（Node 运行时会被 CF 指纹识别），
      # 改用官方预编译二进制（Bun 运行时），参见 apkmd issue #33
      - name: Install apkmd (official prebuilt binary)
        run: |
          set -euo pipefail
          API="repos/tanishqmanuja/apkmirror-downloader/releases/latest"
          echo "Release 资产列表（用于排查）："
          gh api "$API" --jq '.assets[].name'
          BIN_URL=$(gh api "$API" \
            --jq '[.assets[] | select(.name | test("linux";"i")) | select(.name | test("x64|amd64";"i"))][0].browser_download_url // empty')
          if [ -z "$BIN_URL" ]; then
            echo "::error::未匹配到 linux-x64 资产，请根据上方列表手动调整匹配模式"
            exit 1
          fi
          echo "下载二进制：$BIN_URL"
          curl -fsSL "$BIN_URL" -o /tmp/apkmd-dl
          FT=$(file -b /tmp/apkmd-dl)
          echo "文件类型：$FT"
          case "$FT" in
            *ELF*)
              # 裸可执行文件
              sudo install -m 0755 /tmp/apkmd-dl /usr/local/bin/apkmd ;;
            *)
              # 压缩包形式，解压后找可执行文件
              mkdir -p /tmp/apkmd-extract
              tar -xf /tmp/apkmd-dl -C /tmp/apkmd-extract 2>/dev/null \
                || unzip -qo /tmp/apkmd-dl -d /tmp/apkmd-extract
              BIN=$(find /tmp/apkmd-extract -type f -name '*apkmd*' | head -n 1)
              [ -z "$BIN" ] && { echo "::error::压缩包内未找到 apkmd 可执行文件"; exit 1; }
              sudo install -m 0755 "$BIN" /usr/local/bin/apkmd ;;
          esac
          apkmd --help

      - name: Create apps.json
        env:
          APPS_INPUT: ${{ inputs.apps }}
          ARCH: ${{ inputs.architecture }}
          APP_TYPE: ${{ inputs.app_type }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/apks-apkmirror-${BUILD_DATE}"
          mkdir -p "$OUT_DIR" /tmp/apkmd
          apps_json=""
          count=0
          IFS=';' read -ra app_list <<< "$APPS_INPUT"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | xargs)
            [ -z "$app" ] && continue
            org="${app%%/*}"
            repo="${app##*/}"
            if [ "$app" = "$org" ] || [ -z "$repo" ]; then
              echo "::error::输入格式应为 org/repo，收到: $app"
              exit 1
            fi
            [ -n "$apps_json" ] && apps_json+=","
            apps_json+="    {\"org\": \"$org\", \"repo\": \"$repo\"}"
            count=$((count + 1))
            echo "已添加：org=$org, repo=$repo" >&2
          done
          [ "$count" -eq 0 ] && { echo "::error::应用列表为空"; exit 1; }
          {
            echo '{'
            echo '  "options": {'
            echo '    "arch": "'"$ARCH"'",'
            echo '    "type": "'"$APP_TYPE"'",'
            echo '    "outDir": "'"$OUT_DIR"'"'
            echo '  },'
            echo '  "apps": ['
            echo "$apps_json"
            echo '  ]'
            echo '}'
          } > /tmp/apkmd/apps.json
          echo "APP_COUNT=$count" >> "$GITHUB_ENV"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          cat /tmp/apkmd/apps.json

      - name: Download APKs from APKMirror (file-verified retry)
        env:
          MAX_RETRIES: ${{ inputs.max_retries }}
          BASE_DELAY: ${{ inputs.retry_base_delay }}
        run: |
          set -euo pipefail
          cd /tmp/apkmd
          EXPECTED="${APP_COUNT}"

          count_files() {
            find "$OUT_DIR" -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.apks' -o -iname '*.xapk' \) | wc -l | tr -d ' '
          }

          attempt=1
          while true; do
            echo "=== 尝试第 $attempt/$MAX_RETRIES 次 ==="
            apkmd apps.json || echo "::warning::apkmd 返回非零退出码（第 $attempt 次尝试）"
            n=$(count_files)
            echo "当前已下载文件数：$n / 期望（应用数）：$EXPECTED"
            if [ "$n" -ge "$EXPECTED" ]; then
              echo "✅ 已下载全部应用"
              break
            fi
            if [ "$attempt" -ge "$MAX_RETRIES" ]; then
              if [ "$n" -gt 0 ]; then
                echo "::warning::重试耗尽，仅下载到 $n/$EXPECTED 个，继续处理已下载内容"
                break
              fi
              echo "::error::重试 $MAX_RETRIES 次后一个文件都没下载到，终止"
              exit 1
            fi
            delay=$((BASE_DELAY * (2 ** (attempt - 1))))
            echo "未下载完整，${delay}s 后重试..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: List downloaded files (final check)
        run: |
          set -euo pipefail
          n=$(find "$OUT_DIR" -type f | wc -l | tr -d ' ')
          [ "$n" -eq 0 ] && { echo "::error::目录为空，中止发布"; exit 1; }
          echo "共 $n 个文件："
          ls -lh "$OUT_DIR/"

      - name: Encrypt apks and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ARTIFACT_DIRECTORY_PATH: "./apks-apkmirror-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-from-apkmirror"
