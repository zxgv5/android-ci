name: build-apk-tv-lowbt

on:
  workflow_dispatch:
  workflow_call:

env:
  JDK_VERSION: '21'
  JDK_DISTRIBUTION: 'temurin'
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean runner environment
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf ~/.android/build-cache/
          rm -rf .gradle

      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: qwerty12/TVLowQualityBT
          ref: master
          path: tvlowbt_source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout ci source repo
        uses: actions/checkout@v4
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "${{ env.JDK_VERSION }}"
          distribution: "${{ env.JDK_DISTRIBUTION }}"

      # 1) 安装 Android SDK（确保有 cmdline-tools / adb / sdkmanager 等）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 2) 启用 KVM（ubuntu-latest 上硬件加速模拟器需要）
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 3) 用 android-emulator-runner 启动 API 34 模拟器，并在其中调用 hiddenjar
      - name: Build hidden android.jar from emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 使用 API 34（BluetoothCodecConfig 等在 33 公开，用 34 更稳）
          api-level: 34
          arch: x86_64
          profile: pixel_2
          # 模拟器选项：无窗口、无音频、GPU 软件渲染，适合 CI
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          # 启动后执行的脚本：下载 hiddenjar，构建并安装带隐藏 API 的 android.jar
          script: |
            set -e
            cd "${RUNNER_TEMP}"

            # 3.1 克隆 android-hidden-api 仓库（包含 hiddenjar CLI）
            git clone --depth=1 https://github.com/anggrayudi/android-hidden-api.git android-hidden-api
            cd android-hidden-api

            # 3.2 用 hiddenjar 从当前 AVD 构建带隐藏 API 的 android.jar，并安装到 SDK
            #     --api 34 对应 compileSdk 34
            #     --install 会备份原有 android.jar 并替换为新的
            ./cli/hiddenjar build --api 34 --install

      # 4) 把项目的 compileSdk 从 31 改成 34，让 BluetoothCodecConfig 等类可见
      - name: Patch project to compileSdk 34
        working-directory: ./tvlowbt_source
        run: |
          sed -i 's/compileSdk 31/compileSdk 34/' app/build.gradle

      # 5) 签名配置与构建
      - name: Decode keystore and create init script
        working-directory: ./tvlowbt_source
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.p12
          cat > init.gradle << EOF
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.application')) {
                      if (!project.android.signingConfigs.hasProperty('release')) {
                          project.android.signingConfigs.create('release')
                      }
                      def releaseConfig = project.android.signingConfigs.getByName('release')
                      releaseConfig.storeFile = project.rootProject.file('app/keystore.p12')
                      releaseConfig.storePassword = System.getenv('KEYSTORE_PASSWORD')
                      releaseConfig.keyAlias = System.getenv('KEY_ALIAS')
                      releaseConfig.keyPassword = System.getenv('KEYSTORE_PASSWORD')
                      releaseConfig.storeType = 'PKCS12'
                      releaseConfig.enableV1Signing = true
                      releaseConfig.enableV2Signing = true
                      releaseConfig.enableV3Signing = true
                      project.android.buildTypes.release.signingConfig = releaseConfig
                  }
              }
          }
          EOF

      - name: Build signed APK
        working-directory: ./tvlowbt_source
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -I init.gradle

      - name: List generated APK files
        working-directory: ./tvlowbt_source
        run: |
          echo "Listing all APK files generated:"
          find app/build/outputs -type f -name "*.apk" | sort

      - name: Rename and move APK
        working-directory: ./tvlowbt_source
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          mv "./app/build/outputs/apk/release/app-release.apk" "${{ github.workspace }}/dist/tv-lowbt-${{ env.BUILD_DATE }}.apk"

      - name: Erase keystore, encrypt package and create release
        uses: ./ci_source/.github/actions/erase_aes256pac_release/
        with:
          P12_KEYSTORE_PATH: "./tvlowbt_source/app/keystore.p12"
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          BUILD_ARTIFACT_PATH: "./dist/tv-lowbt-${{ env.BUILD_DATE }}.apk"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-tv-lowbt"
