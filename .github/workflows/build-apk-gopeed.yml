name: build-apk-gopeed

on:
  workflow_dispatch:
  workflow_call:

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clean runner environment
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf ~/.android/build-cache/
          rm -rf .gradle

      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: GopeedLab/gopeed
          ref: main
          path: gopeed_source
          fetch-depth: 0

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Setup java
        uses: actions/setup-java@main
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"
          cache-dependency-path: |
            ./gopeed_source/ui/flutter/android/*.gradle*
            ./gopeed_source/ui/flutter/android/**/gradle-wrapper.properties

      - name: Setup go
        uses: actions/setup-go@main
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ./gopeed_source/go.sum


      - name: Setup flutter
        uses: subosito/flutter-action@main
        with:
          channel: stable
          flutter-version: "3.41.6"
          cache: true

      - name: Accept android sdk licenses
        run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses

      # 官方CI将签名写入 ui/flutter/android/app/upload-keystore.jks；
      # key.properties 为Flutter标准签名配置写法，若gradle读取的文件名/字段
      # 与此不同，以 ui/flutter/android/app/build.gradle 中的实际逻辑为准
      - name: Decode and write keys
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > gopeed_source/ui/flutter/android/app/upload-keystore.jks
            echo storeFile='upload-keystore.jks' > gopeed_source/ui/flutter/android/key.properties
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> gopeed_source/ui/flutter/android/key.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> gopeed_source/ui/flutter/android/key.properties
            echo keyPassword='${{ secrets.KEY_ALIAS_PASSWORD }}' >> gopeed_source/ui/flutter/android/key.properties
          fi

      # gomobile 必须在仓库根（go module 所在目录）执行，依赖 runner 预装的 Android NDK
      - name: Build go core aar
        working-directory: ./gopeed_source
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          go install golang.org/x/mobile/cmd/gomobile@latest
          go get golang.org/x/mobile/bind
          gomobile init
          mkdir -p ui/flutter/android/app/libs
          gomobile bind -tags nosqlite -ldflags="-w -s -checklinkname=0 -X github.com/GopeedLab/gopeed/pkg/base.Version=$VERSION" -o ui/flutter/android/app/libs/libgopeed.aar -target=android -androidapi 21 -javapkg="com.gopeed" github.com/GopeedLab/gopeed/bind/mobile

      - name: Flutter build release apk
        # 仅编译arm64-v8a架构版本
        working-directory: ./gopeed_source/ui/flutter
        run: flutter build apk --release --target-platform=android-arm64 --split-per-abi --dart-define="UPDATE_CHANNEL=androidApk" --pub

      - name: Rename apk file
        working-directory: ./gopeed_source/ui/flutter
        run: |
          mv "./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "./build/app/outputs/flutter-apk/gopeed-${{ env.BUILD_DATE }}.apk"

      - name: Erase keystore, encrypt package and create release
        uses: ./ci_source/.github/actions/erase_aes256pac_release/
        with:
          # 文件路径为基于github.workspace的绝对路径
          P12_KEYSTORE_PATH: "./gopeed_source/ui/flutter/android/app/upload-keystore.jks ./gopeed_source/ui/flutter/android/key.properties"
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          BUILD_ARTIFACT_PATH: "./gopeed_source/ui/flutter/build/app/outputs/flutter-apk/gopeed-${{ env.BUILD_DATE }}.apk"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-gopeed"
