name: download-apks-from-purex

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Android 包名列表，分号分隔（如 com.cxinventor.file.explorer）"
        required: true
        default: "com.google.android.youtube"
        type: string
      architecture:
        description: "架构（arm64-v8a、armeabi-v7a、x86_64、x86；或 all 表示全架构 bundle）"
        required: false
        default: "arm64-v8a"
        type: string
      expected_cert_sha256:
        description: "可选：期望的签名证书 SHA-256 指纹（多个用逗号分隔），用于校验"
        required: false
        default: ""
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  download:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      # 用 Go 官方 action 安装 apkpure（kyungw00k/apkpure 的 CLI 入口）
      - name: Setup Go
        uses: actions/setup-go@main
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install apkpure
        run: |
          set -euo pipefail
          go install github.com/kyungw00k/apkpure/cmd/apkpure@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          apkpure -V

      - name: Setup Java (for apksigner)
        uses: actions/setup-java@main
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APKs from APKPure
        env:
          APPS_INPUT: ${{ inputs.apps }}
          ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/apks-from-purex-${BUILD_DATE}"
          mkdir -p "$OUT_DIR"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

          # arch=all 映射为全架构（XAPK bundle）
          if [ "$ARCH" = "all" ]; then
            ALL_ARCH="arm64-v8a;armeabi-v7a;x86;x86_64"
          else
            ALL_ARCH="$ARCH"
          fi
          echo "resolved arch: $ALL_ARCH"

          pkgs_ok=0
          pkgs_total=0
          IFS=';' read -ra pkg_list <<< "$APPS_INPUT"
          for pkg in "${pkg_list[@]}"; do
            pkg=$(echo "$pkg" | xargs)
            [ -z "$pkg" ] && continue
            pkgs_total=$((pkgs_total + 1))
            echo ""
            echo "=== downloading $pkg (arch=$ALL_ARCH) ==="
            # apkpure 的 -o 选项用逗号分隔；arch 多值用分号
            if apkpure -a "$pkg" \
                -o "arch=$ALL_ARCH" \
                "$OUT_DIR" ; then
              echo "OK: $pkg downloaded"
              pkgs_ok=$((pkgs_ok + 1))
            else
              echo "::warning::failed to download $pkg"
            fi
          done

          echo ""
          echo "=== download summary: $pkgs_ok / $pkgs_total ==="
          if [ "$pkgs_ok" -eq 0 ]; then
            echo "::error::no packages downloaded"
            exit 1
          fi

      - name: Verify target ABI present
        env:
          ARCH: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          failed=0
          shopt -s nullglob
          for f in "$OUT_DIR"/*.apk "$OUT_DIR"/*.xapk "$OUT_DIR"/*.apkm; do
            [ -f "$f" ] || continue
            echo ""
            echo "--- $(basename "$f") ---"
            abis=""
            case "$f" in
              *.apk)
                SDK_BT=$(ls -d "${ANDROID_HOME}/build-tools"/*/ 2>/dev/null | sort -V | tail -n1)
                AAPT="${SDK_BT}/aapt"
                abis=$("$AAPT" dump badging "$f" | grep -oP "native-code: '\K[^']+" || true)
                ;;
              *.xapk|*.apkm)
                TMP=$(mktemp -d)
                unzip -qo "$f" -d "$TMP"
                abis=$(find "$TMP" -type d -path '*/lib/*' -mindepth 2 -maxdepth 2 -printf '%f\n' 2>/dev/null | sort -u | paste -sd, -)
                if [ -z "$abis" ]; then
                  abis=$(ls "$TMP" | grep -oP 'config\.\K(arm64_v8a|armeabi_v7a|x86_64|x86)' | sort -u | tr '_' '-' | paste -sd, -)
                fi
                rm -rf "$TMP"
                ;;
            esac
            if [ -z "$abis" ]; then
              echo "::warning::no native libs detected in $(basename "$f") (pure-Java app?)"
              continue
            fi
            echo "detected ABIs: $abis"
            # arch=all 时检查是否包含全部目标架构
            if [ "$ARCH" = "all" ]; then
              want="arm64-v8a armeabi-v7a x86 x86_64"
              missing=""
              for a in $want; do
                if ! echo "$abis" | tr ',' '\n' | grep -qx "$a"; then
                  missing="$missing $a"
                fi
              done
              if [ -n "$missing" ]; then
                echo "::error::$(basename "$f") missing arch(es):$missing"
                failed=$((failed + 1))
              else
                echo "OK: all requested arches present"
              fi
            else
              if ! echo "$abis" | tr ',' '\n' | grep -qx "$ARCH"; then
                echo "::error::$(basename "$f") does NOT contain requested arch '$ARCH'"
                failed=$((failed + 1))
              else
                echo "OK: requested arch '$ARCH' present"
              fi
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed file(s) with wrong arch -- MANUAL INTERVENTION REQUIRED"
            exit 1
          fi
          echo "all files contain target arch"

      - name: Verify APK signatures
        env:
          EXPECTED_CERTS: ${{ inputs.expected_cert_sha256 }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}/build-tools"
          AAPT=$(ls -d "$SDK"/*/ 2>/dev/null | sort -V | tail -n1)
          APKSIGNER=$(find "$AAPT" -name 'apksigner' -type f | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in build-tools"
            exit 1
          fi
          echo "using apksigner: $APKSIGNER"

          failed=0
          shopt -s nullglob
          for apk in "$OUT_DIR"/*.apk "$OUT_DIR"/*.apkm "$OUT_DIR"/*.xapk; do
            [ -f "$apk" ] || continue
            echo ""
            echo "--- $(basename "$apk") ---"
            if [[ "$apk" == *.apkm || "$apk" == *.xapk ]]; then
              TMP=$(mktemp -d)
              unzip -qo "$apk" -d "$TMP"
              APK_FILE=$(find "$TMP" -name 'base.apk' | head -n1)
              [ -z "$APK_FILE" ] && APK_FILE=$(find "$TMP" -name '*.apk' | head -n1)
            else
              APK_FILE="$apk"
            fi
            if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
              echo "::warning::no inner APK found in $apk"
              failed=$((failed + 1))
              continue
            fi
            CERTS=$("$APKSIGNER" verify --print-certs "$APK_FILE" | grep -i "SHA-256" || true)
            echo "$CERTS"
            if [ -z "$CERTS" ]; then
              echo "::warning::no signature found (unsigned APK?)"
              failed=$((failed + 1))
              continue
            fi
            if [ -n "$EXPECTED_CERTS" ]; then
              match=0
              IFS=',' read -ra expected_list <<< "$EXPECTED_CERTS"
              for exp in "${expected_list[@]}"; do
                exp=$(echo "$exp" | xargs | tr '[:upper:]' '[:lower:]' | tr -d ':')
                if echo "$CERTS" | tr '[:upper:]' '[:lower:]' | tr -d ':' | grep -q "$exp"; then
                  match=1
                  break
                fi
              done
              if [ "$match" -eq 0 ]; then
                echo "::error::signature mismatch for $(basename "$apk")"
                failed=$((failed + 1))
              else
                echo "signature matches expected fingerprint"
              fi
            fi
            [ -n "${TMP:-}" ] && rm -rf "$TMP" && unset TMP
          done

          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed APK(s) failed signature verification"
            exit 1
          fi
          echo "all APK signatures verified"

      - name: Final check
        run: |
          set -euo pipefail
          n=$(find "$OUT_DIR" -type f | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::error::output directory is empty, aborting"
            exit 1
          fi
          echo "total $n file(s):"
          ls -lh "$OUT_DIR/"

      - name: Encrypt apks and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ARTIFACT_DIRECTORY_PATH: "./apks-from-purex-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-from-purex"
