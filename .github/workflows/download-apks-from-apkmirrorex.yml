name: download-apks-from-apkmirrorex

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "应用列表，格式：org/repo，分号分隔"
        required: true
        default: "mx-tech/mx-player"
        type: string
      architecture:
        description: "架构"
        required: false
        default: "arm64-v8a"
        type: string
      architecture_fallback:
        description: "回退架构（留空禁用）"
        required: false
        default: "universal"
        type: string
      app_type:
        description: "下载类型（apk 或 bundle）"
        required: false
        default: "apk"
        type: string
      max_retries:
        description: "整批最大尝试次数"
        required: false
        default: "3"
        type: string
      retry_base_delay:
        description: "重试基础间隔（秒）"
        required: false
        default: "30"
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  download:
    runs-on: ubuntu-latest
    permissions: write-all
    # FlareSolverr：内置真实 Chromium，负责过 Cloudflare 挑战
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info

    steps:
      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@main
        with:
          node-version: '22'

      - name: Install apkmirror-downloader
        env:
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/apks-apkmirrorex-${BUILD_DATE}"
          WORK="${GITHUB_WORKSPACE}/apkmd-tool"
          mkdir -p "$OUT_DIR" "$WORK"
          cd "$WORK"
          # 手写 package.json，避免 npm init 依赖目录名（点前缀目录会生成非法包名）
          cat > package.json <<'EOF'
          {
            "name": "apkmd-downloader-runner",
            "version": "1.0.0",
            "private": true
          }
          EOF
          npm install apkmirror-downloader --no-audit --no-fund --silent
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          APP_COUNT=$(echo "$APPS_INPUT" | tr ';' '\n' | grep -c . || true)
          echo "APP_COUNT=$APP_COUNT" >> "$GITHUB_ENV"

      - name: Create apps.json
        working-directory: apkmd-tool
        env:
          APPS_INPUT: ${{ inputs.apps }}
          ARCH: ${{ inputs.architecture }}
          ARCH_FALLBACK: ${{ inputs.architecture_fallback }}
          APP_TYPE: ${{ inputs.app_type }}
        run: |
          set -euo pipefail
          apps_json=""
          count=0
          IFS=';' read -ra app_list <<< "$APPS_INPUT"
          for app in "${app_list[@]}"; do
            app=$(echo "$app" | xargs)
            if [ -z "$app" ]; then continue; fi
            org="${app%%/*}"
            repo="${app##*/}"
            if [ "$app" = "$org" ] || [ -z "$repo" ]; then
              echo "::error::invalid format, expected org/repo, got: $app"
              exit 1
            fi
            if [ -n "$apps_json" ]; then apps_json="${apps_json},"; fi
            apps_json="${apps_json}    {\"org\": \"$org\", \"repo\": \"$repo\"}"
            count=$((count + 1))
            echo "added: org=$org, repo=$repo"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::app list is empty"
            exit 1
          fi
          {
            echo '{'
            echo '  "options": {'
            echo "    \"arch\": \"$ARCH\","
            if [ -n "$ARCH_FALLBACK" ]; then
              echo "    \"fallbackArch\": \"$ARCH_FALLBACK\","
            fi
            echo "    \"type\": \"$APP_TYPE\","
            echo "    \"outDir\": \"$OUT_DIR\""
            echo '  },'
            echo '  "apps": ['
            echo "$apps_json"
            echo '  ]'
            echo '}'
          } > apps.json
          cat apps.json

      # fetch 预加载补丁：apkmd 首次访问 apkmirror.com 时，
      # 先经 FlareSolverr（真实 Chromium）过 CF 挑战，取回 cookies + UA 注入
      - name: Write fetch-preload patch
        working-directory: apkmd-tool
        run: |
          cat > flare-patch.cjs <<'PATCH_EOF'
          const FLARE_URL = process.env.FLARESOLVR_URL || "http://localhost:8191/v1";
          const TARGET = "https://www.apkmirror.com";
          const SOLVE_URL = process.env.FLARE_SOLVE_URL || (TARGET + "/");

          let credsPromise = null;
          function ensureCreds() {
            if (!credsPromise) {
              credsPromise = (async () => {
                console.log("[flare] solving challenge via FlareSolverr for " + SOLVE_URL);
                const res = await fetch(FLARE_URL, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ cmd: "request.get", url: SOLVE_URL, maxTimeout: 60000 })
                });
                const data = await res.json();
                if (data.status !== "ok" || !data.solution) {
                  throw new Error("FlareSolverr failed: " + (data.message || data.status));
                }
                const body = String(data.solution.response || "");
                if (/page not found/i.test(body)) {
                  console.error("::error::slug not found on APKMirror: " + SOLVE_URL);
                  process.exit(1);
                }
                const cookie = (data.solution.cookies || [])
                  .map(function (c) { return c.name + "=" + c.value; })
                  .join("; ");
                const ua = data.solution.userAgent || "";
                if (!cookie) throw new Error("FlareSolverr returned no cookies");
                console.log("[flare] cookies acquired, UA: " + ua.slice(0, 60) + "...");
                return { cookie: cookie, ua: ua };
              })();
            }
            return credsPromise;
          }

          const realFetch = globalThis.fetch;
          if (!realFetch) {
            console.error("[flare-patch] global fetch missing, Node >= 18 required");
            process.exit(1);
          }
          globalThis.fetch = async function patchedFetch(input, init) {
            init = init || {};
            let url = "";
            if (typeof input === "string") url = input;
            else if (input && input.url) url = input.url;
            if (url.indexOf(TARGET) === 0) {
              try {
                const creds = await ensureCreds();
                const headers = new Headers(init.headers || (input && input.headers) || {});
                if (!headers.has("cookie")) headers.set("cookie", creds.cookie);
                if (!headers.has("user-agent")) headers.set("user-agent", creds.ua);
                if (!headers.has("referer")) headers.set("referer", TARGET + "/");
                init = Object.assign({}, init, { headers: headers });
              } catch (e) {
                console.error("[flare-patch] credential fetch failed: " + e.message);
              }
            }
            return realFetch(input, init);
          };
          console.log("[flare-patch] global fetch patched");
          PATCH_EOF

      # 等待 FlareSolverr 就绪（不依赖容器 health-cmd，镜像内不一定有 curl）
      - name: Wait for FlareSolverr
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8191/ || echo "000")
            if [ "$code" != "000" ]; then
              echo "FlareSolverr ready (HTTP $code)"
              exit 0
            fi
            echo "waiting... ($i/30)"
            sleep 2
          done
          echo "::error::FlareSolverr did not become ready"
          exit 1

      - name: Download APKs (file-count verified retry)
        working-directory: apkmd-tool
        env:
          APPS_INPUT: ${{ inputs.apps }}
          FLARESOLVR_URL: http://localhost:8191/v1
          MAX_RETRIES: ${{ inputs.max_retries }}
          BASE_DELAY: ${{ inputs.retry_base_delay }}
        run: |
          set -euo pipefail
          EXPECTED="${APP_COUNT}"
          FIRST_SLUG=$(echo "$APPS_INPUT" | tr ';' '\n' | head -n1 | xargs)
          export FLARE_SOLVE_URL="https://www.apkmirror.com/apk/${FIRST_SLUG}/"
          # 直接用 node 跑真实入口文件，绕开 npm 包 bin 缺 shebang 的问题；
          # NODE_OPTIONS 会把预加载补丁注入 node 子进程
          APKMD_BIN=$(realpath ./node_modules/.bin/apkmd)
          echo "apkmd entry: $APKMD_BIN"

          count_files() {
            find "$OUT_DIR" -type f \( -iname '*.apk' -o -iname '*.apkm' -o -iname '*.apks' -o -iname '*.xapk' \) | wc -l | tr -d ' '
          }

          attempt=1
          while true; do
            echo "=== attempt $attempt/$MAX_RETRIES ==="
            NODE_OPTIONS="--require $PWD/flare-patch.cjs" node "$APKMD_BIN" apps.json \
              || echo "::warning::apkmd exited non-zero (attempt $attempt)"
            n=$(count_files)
            echo "files: $n / expected: $EXPECTED"
            if [ "$n" -ge "$EXPECTED" ]; then
              echo "all apps downloaded"
              break
            fi
            if [ "$attempt" -ge "$MAX_RETRIES" ]; then
              if [ "$n" -gt 0 ]; then
                echo "::warning::retries exhausted, got $n/$EXPECTED, continue with partial"
                break
              fi
              echo "::error::no files downloaded after $MAX_RETRIES attempts"
              exit 1
            fi
            delay=$((BASE_DELAY * (2 ** (attempt - 1))))
            echo "incomplete, retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Final check
        run: |
          set -euo pipefail
          n=$(find "$OUT_DIR" -type f | wc -l | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::error::output directory is empty, aborting"
            exit 1
          fi
          echo "total $n file(s):"
          ls -lh "$OUT_DIR/"

      - name: Encrypt apks and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          ARTIFACT_DIRECTORY_PATH: "./apks-apkmirrorex-${{ env.BUILD_DATE }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-from-apkmirrorex"
