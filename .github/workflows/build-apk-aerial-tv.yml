name: build-apk-aerial-tv

on:
  workflow_dispatch:
  workflow_call:

env:
  JDK_VERSION: '17'          # aerial-tv 的 JVM 目标为 17（app/build.gradle.kts），AGP 8.12 最低要求 JDK 17
  JDK_DISTRIBUTION: 'temurin'
  ANDROID_COMPILE_SDK: '36'  # 与项目 compileSdk = 36 一致
  ANDROID_BUILD_TOOLS: '36.0.0'
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clean runner environment
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/daemon/
          rm -rf ~/.android/build-cache/
          rm -rf .gradle

      - name: Checkout source repo
        uses: actions/checkout@main
        with:
          repository: pengchujin/aerial-tv
          ref: main
          path: aerial_source
          fetch-depth: 0
          submodules: recursive

      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Setup java
        uses: actions/setup-java@main
        with:
          java-version: "${{ env.JDK_VERSION }}"
          distribution: "${{ env.JDK_DISTRIBUTION }}"

      - name: Decode keystore and create init script
        working-directory: ./aerial_source
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.p12
          cat > init.gradle << EOF
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin('com.android.application')) {
                      if (!project.android.signingConfigs.hasProperty('release')) {
                          project.android.signingConfigs.create('release')
                      }
                      def releaseConfig = project.android.signingConfigs.getByName('release')
                      releaseConfig.storeFile = project.rootProject.file('app/keystore.p12')
                      releaseConfig.storePassword = System.getenv('KEYSTORE_PASSWORD')
                      releaseConfig.keyAlias = System.getenv('KEY_ALIAS')
                      releaseConfig.keyPassword = System.getenv('KEYSTORE_PASSWORD')
                      releaseConfig.storeType = 'PKCS12'
                      releaseConfig.enableV1Signing = true
                      releaseConfig.enableV2Signing = true
                      releaseConfig.enableV3Signing = true
                      project.android.buildTypes.release.signingConfig = releaseConfig
                  }
              }
          }
          EOF

      - name: Build signed apk with init script
        working-directory: ./aerial_source
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon -I init.gradle
        # 必须限定 :app 模块：仓库含 :app 与 :lite 两个 application 模块，
        # 不带前缀的 assembleRelease 会两个都构建，:lite 的 minSdk = 14
        # （Android 4.0-4.4 TV 专用精简版）在 ECDSA 密钥 + v1 签名下
        # 会报 "ECDSA signatures only supported for minSdkVersion 18 and higher"。
        # :app:minSdk = 21（Android 5.0），不受影响，standard/guard 两个 flavor 正常产出：
        #   app/build/outputs/apk/standard/release/app-standard-release.apk
        #   app/build/outputs/apk/guard/release/app-guard-release.apk

      - name: List generated apk files
        working-directory: ./aerial_source
        run: |
          echo "Listing all apk files generated:"
          find app/build/outputs -type f -name "*.apk" | sort

      - name: Rename and move
        working-directory: ./aerial_source
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          mv "./app/build/outputs/apk/standard/release/app-standard-release.apk" "${{ github.workspace }}/dist/aerial-standard-${{ env.BUILD_DATE }}.apk"
          mv "./app/build/outputs/apk/guard/release/app-guard-release.apk" "${{ github.workspace }}/dist/aerial-guard-${{ env.BUILD_DATE }}.apk"

      - name: Erase keystore, encrypt package and create release (standard)
        uses: ./ci_source/.github/actions/erase_aes256pac_release/
        with:
          P12_KEYSTORE_PATH: "./aerial_source/app/keystore.p12"
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          BUILD_ARTIFACT_PATH: "./dist/aerial-standard-${{ env.BUILD_DATE }}.apk"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-aerial"

      - name: Recreate keystore for guard release
        # 重新落地密钥，确保下一个 release 步骤仍可执行擦除（若 erase 动作本身幂等，此步冗余但无害）
        working-directory: ./aerial_source
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.p12

      - name: Erase keystore, encrypt package and create release (guard)
        uses: ./ci_source/.github/actions/erase_aes256pac_release/
        with:
          P12_KEYSTORE_PATH: "./aerial_source/app/keystore.p12"
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          BUILD_ARTIFACT_PATH: "./dist/aerial-guard-${{ env.BUILD_DATE }}.apk"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-aerial-guard"
